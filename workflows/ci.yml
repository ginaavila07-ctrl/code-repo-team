name: Continuous Integration

# Controls when the pipeline will run
on:
  push:
    branches:
      - ci-demo
  pull_request:
    branches:
      - ci-demo

# A workflow run is made up of one or more jobs
jobs:
  build-and-test:
    # The type of runner that the job will run on
    runs-on: ubuntu-latest

    # Steps represent a sequence of tasks that will be executed as part of the job
    steps:
      # Step 1: Check out the repository code under $GITHUB_WORKSPACE
      - name: Check out repository code
        uses: actions/checkout@v4

      # Step 2: Set up the programming language runtime (Node.js example)
      - name: Set up Node.js environment
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm' # Optimizes speed by caching dependencies

      # Step 3: Install project dependencies
      - name: Install dependencies
        run: npm ci

      # Step 4: Run linter/code style checks (Optional but recommended)
      - name: Run linter
        run: npm run lint
        continue-on-error: true # Prevents pipeline from failing completely on style issues

      # Step 5: Run the test suite
      - name: Run automated tests
        run: npm test
